# Reusable workflow: Docs / MDX site CI.
#
# Call from a caller workflow in a consuming repo:
#
#   jobs:
#     ci:
#       uses: nyuchi/.github/.github/workflows/reusable-ci-docs-mdx.yml@main
#       with:
#         build-command: "pnpm build"
#
# The caller must grant `contents: read`.

name: Reusable / CI / Docs MDX

on:
  workflow_call:
    inputs:
      build-command:
        description: Shell command that builds the site.
        type: string
        default: "pnpm build"
      node-version-file:
        description: Path to the file pinning the Node version.
        type: string
        default: .nvmrc
      files-glob:
        description: Glob used by cspell and lychee to find content files.
        type: string
        default: "**/*.{md,mdx}"

permissions:
  contents: read

jobs:
  spellcheck:
    name: Spellcheck (cspell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0
      - uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8  # v9.0.1
        with:
          incremental_files_only: ${{ github.event_name == 'pull_request' }}
          files: ${{ inputs.files-glob }}

  link-check:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2
        with:
          args: >-
            --cache
            --max-cache-age 1d
            --no-progress
            --max-concurrency 8
            --exclude-mail
            './**/*.md'
            './**/*.mdx'
          fail: true

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        shell: bash
        run: |
          set -euo pipefail
          bash -c "$BUILD_COMMAND"
