# Reusable workflow: Rust monorepo CI (Cargo workspace).
#
# Call from a caller workflow in a consuming repo:
#
#   jobs:
#     ci:
#       uses: nyuchi/.github/.github/workflows/reusable-ci-rust-monorepo.yml@main
#       with:
#         toolchain: stable
#
# The caller must grant `contents: read`.

name: Reusable / CI / Rust monorepo

on:
  workflow_call:
    inputs:
      toolchain:
        description: |
          Rust toolchain channel or version to install. The default is
          `stable`, which tracks the latest stable release per NA-03 §6.1.
          Override only for deliberate version pins (e.g. `beta`, `nightly`,
          or a specific `1.85` style pin for reproducible CI).
        type: string
        default: stable

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'

  fmt:
    name: cargo fmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # dtolnay/rust-toolchain publishes no semver tags; # master is a moving branch ref.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # dtolnay/rust-toolchain publishes no semver tags; # master is a moving branch ref.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo nextest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # dtolnay/rust-toolchain publishes no semver tags; # master is a moving branch ref.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      # taiki-e/install-action uses per-tool moving tags rather than semver.
      - uses: taiki-e/install-action@dfd6a81ff1efc1c100332d760e0c9edfe2ae0a51  # nextest
      - run: cargo nextest run --workspace --all-features
      - name: doctests
        run: cargo test --workspace --doc

  build:
    name: cargo build
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # dtolnay/rust-toolchain publishes no semver tags; # master is a moving branch ref.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo build --workspace --all-features --release

  doc:
    name: cargo doc
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      # dtolnay/rust-toolchain publishes no semver tags; # master is a moving branch ref.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - run: cargo doc --workspace --all-features --no-deps

  deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
      - name: Check for deny.toml
        id: check-deny
        shell: bash
        run: |
          set -euo pipefail
          if [ -f deny.toml ] || [ -f .cargo/deny.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No deny.toml found; cargo deny skipped. Add one to enable supply-chain checks (advisories, bans, licences)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # taiki-e/install-action uses per-tool moving tags rather than semver.
      - uses: taiki-e/install-action@ea2ee51eb0d48fc4f895702355487d299a6f3b22  # cargo-deny
        if: steps.check-deny.outputs.present == 'true'
      - name: cargo deny check
        if: steps.check-deny.outputs.present == 'true'
        run: cargo deny check
