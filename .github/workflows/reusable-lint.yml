# Reusable workflow: strict lint (the org's standard lint policy).
#
# Call from a caller workflow in any repo under nyuchi:
#
#   name: Lint
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     lint:
#       uses: nyuchi/.github/.github/workflows/reusable-lint.yml@main
#
# Every job is BLOCKING. The required-status-checks list in your
# repo's main-branch ruleset should include all five job names:
#   actionlint, JSON validity, prettier, markdownlint, yamllint
#
# The reusable does NOT auto-fix anything. When a check fails,
# the developer fixes locally (`prettier --write`,
# `markdownlint-cli2 --fix`, manual yamllint fix) and pushes
# the corrected commit.
#
# Each consuming repo MUST ship .prettierrc, .prettierignore,
# .yamllint.yaml and .markdownlint.jsonc at its root - copy them
# verbatim from nyuchi/.github. Prettier is invoked with an explicit
# --ignore-path .prettierignore, so .prettierignore is the ONLY ignore
# file that applies; the others auto-discover from the repo root.
#
# CROSS-ORG USE: this repo is public, and a public reusable workflow can
# be called from any repository, including a private one in a different
# org. That is proven in production - private bundu-labs/marketing calls
# this file and publishes all five contexts green. So there is exactly
# ONE copy of the org lint policy, at nyuchi/.github, for all five orgs
# (nyuchi, mzizi-dev, shamwari-ai, mukoko-dev, bundu-labs). Do not fork
# it into the other .github repos - divergent copies are the problem
# this file exists to end.
#
# The caller must grant `contents: read` (the workflow default).

name: Reusable / Lint

on:
  workflow_call:
    inputs:
      prettier-glob:
        description: Glob passed to `prettier --check`.
        type: string
        default: "**/*.{md,mdx,json,jsonc}"
      markdownlint-globs:
        description: Newline-separated globs for markdownlint-cli2.
        type: string
        default: |
          **/*.md
          !**/node_modules/**
      yamllint-target:
        description: Path passed to `yamllint`.
        type: string
        default: "."
      actionlint-paths:
        description: Space-separated globs for actionlint.
        type: string
        default: ".github/workflows/*.yml"
      prettier-version:
        type: string
        default: "3.9.4"
      yamllint-version:
        type: string
        default: "1.38.0"
      markdownlint-version:
        description: >-
          markdownlint-cli2 version. PINNED ON PURPOSE: the
          markdownlint-cli2-action floats its bundled ruleset, so a newer
          rule (MD060) fired in CI while local installs stayed quiet.
          Pin the same version in your repo's devDependencies so
          `npx markdownlint-cli2` locally and CI agree exactly.
        type: string
        default: "0.23.2"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - name: Download actionlint
        id: get_actionlint
        shell: bash
        run: |
          set -euo pipefail
          installer=$(mktemp)
          trap 'rm -f "$installer"' EXIT
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            --output "$installer"
          # Sanity-check we got a shell script, not an HTML error page.
          head -n 1 "$installer" | grep -qE '^#!.*(bash|sh)' \
            || { echo "::error::actionlint installer did not look like a shell script"; head -n 5 "$installer"; exit 1; }
          bash "$installer" 1.7.12
      - name: actionlint
        env:
          ACTIONLINT_BIN: ${{ steps.get_actionlint.outputs.executable }}
          ACTIONLINT_PATHS: ${{ inputs.actionlint-paths }}
        shell: bash
        run: |
          set -euo pipefail
          # Intentional word-splitting: $ACTIONLINT_PATHS is a space-separated glob list.
          # shellcheck disable=SC2086
          "$ACTIONLINT_BIN" -color $ACTIONLINT_PATHS

  jsonlint:
    name: JSON validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - name: Validate every *.json file
        # `-type f` is load-bearing: framework routers create DIRECTORIES
        # whose name ends in .json (e.g. a Next.js App Router segment
        # `app/.well-known/mcp/server-card.json/route.ts`). Without it
        # json.load() raises IsADirectoryError and this job can never pass.
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            if ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$file"; then
              echo "::error file=$file::invalid JSON"
              status=1
            fi
          done < <(find . -type f -name '*.json' \
            -not -path './node_modules/*' -not -path './.git/*' -print0)
          exit "$status"

  prettier:
    name: prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'
      - name: Install prettier
        env:
          PRETTIER_VERSION: ${{ inputs.prettier-version }}
        shell: bash
        run: |
          set -euo pipefail
          # Validate version to guard against injection via inputs.prettier-version.
          if [[ ! "$PRETTIER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid prettier-version '$PRETTIER_VERSION' — expected semver."
            exit 1
          fi
          npm install --global "prettier@$PRETTIER_VERSION"
      - name: Audit .gitignore for shadowed lint targets
        # Prettier 3 reads BOTH .gitignore and .prettierignore by default.
        # mukoko-home's .gitignore contained `claude.md`, which silently
        # exempted the tracked CLAUDE.md from `prettier --check` - the job
        # went green without ever looking at the file. We defeat that below
        # by passing --ignore-path explicitly; this step makes the
        # near-miss visible instead of leaving it as folklore.
        env:
          PRETTIER_GLOB: ${{ inputs.prettier-glob }}
        shell: bash
        run: |
          set -euo pipefail
          shadowed=$(git ls-files | git check-ignore --no-index --stdin || true)
          if [ -n "$shadowed" ]; then
            echo "::notice::These tracked files match a .gitignore pattern."
            echo "They ARE linted, because --ignore-path below is explicit."
            printf '%s\n' "$shadowed"
          else
            echo "No tracked file is shadowed by .gitignore."
          fi
      - name: prettier --check
        # --ignore-path is passed EXPLICITLY so that .gitignore is not
        # consulted. Without it Prettier 3 silently skips any tracked file
        # that .gitignore happens to match, which turns this gate into a
        # no-op for exactly the files someone tried to hide.
        env:
          PRETTIER_GLOB: ${{ inputs.prettier-glob }}
        shell: bash
        run: |
          set -euo pipefail
          prettier --check --ignore-path .prettierignore "$PRETTIER_GLOB"

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'
      - name: Install markdownlint-cli2
        # Deliberately NOT markdownlint-cli2-action. The action pins its
        # own bundled markdownlint-cli2, so bumping the action changed the
        # active ruleset underneath us and MD060 started failing in CI
        # while `npx markdownlint-cli2` locally still passed. Installing an
        # explicit version makes "what CI runs" a number a developer can
        # copy into their own devDependencies.
        env:
          MARKDOWNLINT_VERSION: ${{ inputs.markdownlint-version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MARKDOWNLINT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid markdownlint-version '$MARKDOWNLINT_VERSION' - expected semver."
            exit 1
          fi
          npm install --global "markdownlint-cli2@$MARKDOWNLINT_VERSION"
          echo "markdownlint-cli2 $(markdownlint-cli2 --version 2>&1 | head -n 1)"
      - name: markdownlint-cli2
        env:
          MARKDOWNLINT_GLOBS: ${{ inputs.markdownlint-globs }}
        shell: bash
        run: |
          set -euo pipefail
          globs=()
          while IFS= read -r glob; do
            [ -n "$glob" ] && globs+=("$glob")
          done <<< "$MARKDOWNLINT_GLOBS"
          if [ ${#globs[@]} -eq 0 ]; then
            echo "::error::markdownlint-globs resolved to nothing."
            exit 1
          fi
          markdownlint-cli2 "${globs[@]}"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - name: Install yamllint
        env:
          YAMLLINT_VERSION: ${{ inputs.yamllint-version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$YAMLLINT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid yamllint-version '$YAMLLINT_VERSION' — expected semver."
            exit 1
          fi
          pip install "yamllint==$YAMLLINT_VERSION"
      - name: yamllint (strict)
        env:
          YAMLLINT_TARGET: ${{ inputs.yamllint-target }}
        shell: bash
        run: |
          set -euo pipefail
          # Intentional word-splitting: $YAMLLINT_TARGET may be a space-separated list of paths.
          # shellcheck disable=SC2086
          yamllint -s -f github $YAMLLINT_TARGET
